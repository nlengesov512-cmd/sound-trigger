name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q SoundTrigger-Android-Project.zip
          ls -la SoundTrigger

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("SoundTrigger/app/build.gradle.kts")
          s = p.read_text()

          start = s.index("android {")
          depth = 0
          end = None

          for i in range(start, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break

          if end is None:
              raise Exception("Не найден конец блока android")

          addition = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          s = s[:end] + addition + s[end:]
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd SoundTrigger
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundTrigger-APK
          path: SoundTrigger/app/build/outputs/apk/debug/app-debug.apk
