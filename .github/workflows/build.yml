
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip SoundTrigger-Android-Project.zip
          ls -la SoundTrigger

      - name: Build APK
        run: |
          cd SoundTrigger
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundTrigger-APK
          path: SoundTrigger/app/build/outputs/apk/debug/app-debug.apk
